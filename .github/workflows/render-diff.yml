# Experiment ref only; this is not a production Render Diff replacement.
name: Changed-source release phase experiment
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [phases, baseline-lto, validate, validate-browser, wrapper, wrapper-candidate, wrapper-paired]
        default: phases
        description: Compiler phases or verify the fixed completed phase artifacts
permissions:
  contents: read
  actions: read
concurrency:
  group: rust-build-phases-7473-${{ inputs.mode }}
  cancel-in-progress: false
env:
  CARGO_TARGET_DIR: target/pr-review
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
jobs:
  phases:
    if: (inputs.mode == 'phases' || inputs.mode == 'baseline-lto') && github.repository == 'edwardkim/rhwp' && github.ref == 'refs/heads/codex/rust-build-phases-7473'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        order: [abba, baab]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - name: Assert cold target
        run: test ! -d target/pr-review
      - name: Compile actual Rust edits and compare output types
        env:
          CANDIDATE: ${{ inputs.mode == 'baseline-lto' && 'baseline-lto' || 'fat-lto' }}
        run: python3 scripts/experiments/rust_build_phases.py --order '${{ matrix.order }}' --candidate "$CANDIDATE"
      - name: Preserve phase evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-phases-${{ matrix.order }}
          path: output/rust-build-phases/
          if-no-files-found: error
          retention-days: 3

  validate:
    if: (inputs.mode == 'validate' || inputs.mode == 'validate-browser') && github.repository == 'edwardkim/rhwp' && github.ref == 'refs/heads/codex/rust-build-phases-7473'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact phase run artifacts
        if: inputs.mode == 'validate'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: rust-phases-abba
          run-id: 36514652526
          github-token: ${{ github.token }}
          path: output/phase-input
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Read exact optimized package artifacts
        if: inputs.mode == 'validate-browser'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: rust-phase-validation
          run-id: 36516437863
          github-token: ${{ github.token }}
          path: output/optimized-input
      - name: Get pinned release postprocessing tools
        if: inputs.mode == 'validate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/phase-tools
          gh release download 0.2.127 --repo wasm-bindgen/wasm-bindgen --pattern 'wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz' --dir output/phase-tools
          gh release download version_117 --repo WebAssembly/binaryen --pattern 'binaryen-version_117-x86_64-linux.tar.gz' --dir output/phase-tools
          tar -xzf output/phase-tools/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz -C output/phase-tools
          tar -xzf output/phase-tools/binaryen-version_117-x86_64-linux.tar.gz -C output/phase-tools
      - name: Install browser dependencies
        working-directory: rhwp-studio
        run: |
          npm ci
          browser_path=$(npx @puppeteer/browsers install chromium@1660786 --path .cache/puppeteer --format '{{path}}' | tail -n 1)
          echo "CHROME_PATH=$(realpath "$browser_path")" >> "$GITHUB_ENV"
      - name: Optimize release artifacts and compare API and Canvas
        if: inputs.mode == 'validate'
        run: python3 scripts/experiments/validate_rust_phases.py
      - name: Compare exact optimized artifacts with prepared fixture routes
        if: inputs.mode == 'validate-browser'
        run: python3 scripts/experiments/validate_rust_phases_browser.py
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-phase-validation
          path: output/rust-phase-validation/
          if-no-files-found: warn
          retention-days: 3

  wrapper:
    if: (inputs.mode == 'wrapper' || inputs.mode == 'wrapper-candidate') && github.repository == 'edwardkim/rhwp' && github.ref == 'refs/heads/codex/rust-build-phases-7473'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.mode == 'wrapper-candidate' && '["cdylib"]' || '["dual", "cdylib"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: ./.github/actions/install-wasm-pack
      - name: Prepare actual release validation runtime
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get install -y --no-install-recommends fonts-dejavu-core libfontconfig1-dev libfreetype6-dev poppler-utils
          npm ci --prefix rhwp-studio
          cd rhwp-studio
          browser_path=$(npx @puppeteer/browsers install chromium@1660786 --path .cache/puppeteer --format '{{path}}' | tail -n 1)
          echo "CHROME_PATH=$(realpath "$browser_path")" >> "$GITHUB_ENV"
      - name: Full wrapper cold and changed-source release builds and gates
        run: python3 scripts/experiments/wasm_wrapper_integration.py '${{ matrix.mode }}'
      - name: Preserve wrapper and release gate evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wasm-wrapper-${{ matrix.mode }}
          path: output/wasm-wrapper-integration/
          if-no-files-found: error
          retention-days: 7

  wrapper-paired:
    if: inputs.mode == 'wrapper-paired' && github.repository == 'edwardkim/rhwp' && github.ref == 'refs/heads/codex/rust-build-phases-7473'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/install-wasm-pack
      - name: Seed both configurations then compare full release wrappers on one runner
        run: python3 scripts/experiments/wasm_wrapper_paired.py
      - name: Preserve matched-runner timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wasm-wrapper-paired
          path: output/wasm-wrapper-paired/
          if-no-files-found: error
          retention-days: 7
