# Experiment branch only. Replaces this existing dispatch entrypoint on this ref;
# never proposed as the production Render Diff workflow.
name: Cargo cache canary 7473
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo WASM profile
        type: choice
        options: [dev, release]
        default: dev
        required: true
permissions:
  contents: read
concurrency:
  group: cargo-cache-canary-7473
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: target/pr-review
jobs:
  seed:
    if: github.repository == 'edwardkim/rhwp' && github.ref == 'refs/heads/codex/cargo-cache-canary-7473'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      key: ${{ steps.identity.outputs.key }}
      other_key: ${{ steps.identity.outputs.other_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - name: Profile and toolchain cache identity
        id: identity
        env:
          PROFILE: ${{ inputs.profile }}
        run: python3 scripts/experiments/cargo_cache_canary.py identity --profile "$PROFILE"
      - name: Assert cold target
        run: test ! -d target/pr-review
      - name: Cold Cargo build
        env:
          PROFILE: ${{ inputs.profile }}
        run: python3 scripts/experiments/cargo_cache_canary.py build --profile "$PROFILE" --label seed
      - name: Bound cache size
        run: python3 scripts/experiments/cargo_cache_canary.py snapshot
      - name: Save experiment cache
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/pr-review
          key: ${{ steps.identity.outputs.key }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cargo-canary-seed-${{ inputs.profile }}
          path: output/cargo-cache-canary/
          retention-days: 14
  restore:
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - name: Assert fresh target
        run: test ! -d target/pr-review
      - name: Other profile must miss
        id: mismatch
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/pr-review
          key: ${{ needs.seed.outputs.other_key }}
          lookup-only: true
      - name: Verify profile isolation
        env:
          MATCHED: ${{ steps.mismatch.outputs.cache-matched-key }}
        run: test -z "$MATCHED"
      - name: Restore exact profile cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/pr-review
          key: ${{ needs.seed.outputs.key }}
          fail-on-cache-miss: true
      - name: Record restored identity
        env:
          EXPECTED: ${{ needs.seed.outputs.key }}
          MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$HIT" = true
          test "$MATCHED" = "$EXPECTED"
          mkdir -p output/cargo-cache-canary
          python3 -c 'import json,os; from pathlib import Path; Path("output/cargo-cache-canary/restore.json").write_text(json.dumps({k:os.environ[k] for k in ("EXPECTED","MATCHED","HIT")},indent=2))'
      - name: Cargo after remote restore
        env:
          PROFILE: ${{ inputs.profile }}
        run: python3 scripts/experiments/cargo_cache_canary.py build --profile "$PROFILE" --label restored
      - name: Same runner no-op control
        env:
          PROFILE: ${{ inputs.profile }}
        run: python3 scripts/experiments/cargo_cache_canary.py build --profile "$PROFILE" --label same-runner-noop
      - uses: actions/download-artifact@v6
        with:
          name: cargo-canary-seed-${{ inputs.profile }}
          path: output/canary-seed
      - name: Verify new runner and identical output
        run: python3 scripts/experiments/cargo_cache_canary.py verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cargo-canary-restore-${{ inputs.profile }}
          path: output/cargo-cache-canary/
          retention-days: 14
