# Experiment ref only; this is not a production Render Diff replacement.
name: Changed-source release phase experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-build-phases-7473
  cancel-in-progress: false
env:
  CARGO_TARGET_DIR: target/pr-review
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
jobs:
  phases:
    if: github.repository == 'edwardkim/rhwp' && github.ref == 'refs/heads/codex/rust-build-phases-7473'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        order: [abba, baab]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - name: Assert cold target
        run: test ! -d target/pr-review
      - name: Compile actual Rust edits and compare output types
        run: python3 scripts/experiments/rust_build_phases.py --order '${{ matrix.order }}'
      - name: Preserve phase evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-phases-${{ matrix.order }}
          path: output/rust-build-phases/
          if-no-files-found: error
          retention-days: 3
