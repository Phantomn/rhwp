# Experiment ref only; not a proposed production Render Diff workflow.
name: Same-run WASM package reuse experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-package-reuse-7473
  cancel-in-progress: false
env:
  CARGO_TARGET_DIR: target/pr-review
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  RHWP_CHROMIUM_BUILD_ID: '1660786'
  RHWP_RENDER_DIFF_WRITE_IMAGES: '1'
  RHWP_RENDER_DIFF_MAX_PAGES: '1'
  RHWP_WASM_BUILD_MANIFEST: ${{ github.workspace }}/output/render-diff-build/build.json
jobs:
  producer:
    if: github.repository == 'edwardkim/rhwp' && github.ref == 'refs/heads/codex/wasm-package-reuse-7473'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/install-wasm-pack
      - name: Assert cold target
        run: test ! -d target/pr-review
      - name: Cold release WASM package
        run: python3 scripts/measure_render_diff_wasm.py --profile release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: rhwp-studio
        run: |
          npm ci
          browser_path=$(npx @puppeteer/browsers install chromium@"${RHWP_CHROMIUM_BUILD_ID}" --path .cache/puppeteer --format '{{path}}' | tail -n 1)
          echo "CHROME_PATH=$(realpath "$browser_path")" >> "$GITHUB_ENV"
      - name: Canvas regression and actual WASM response hash
        working-directory: rhwp-studio
        run: npm run e2e:render-diff:ci
      - name: Seal package identity and file checksums
        run: python3 scripts/experiments/wasm_package_reuse.py publish
      - name: Publish immutable same-run package
        id: package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/package-reuse/bundle/
          if-no-files-found: error
          retention-days: 3
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-producer-${{ github.run_attempt }}
          path: |
            output/render-diff-build/
            output/package-reuse/bundle/manifest.json
            rhwp-studio/e2e/screenshots/render-diff/
          retention-days: 3
  consumer:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [hit, corrupt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/install-wasm-pack
      - name: Assert fresh runner target
        run: test ! -d target/pr-review
      - name: Download exact producer artifact
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.producer.outputs.artifact_id }}
          path: output/package-reuse/incoming
          merge-multiple: true
      - name: Corrupt package negative control
        if: matrix.mode == 'corrupt'
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('output/package-reuse/incoming/pkg/rhwp_bg.wasm')
          b=bytearray(p.read_bytes()); b[0] ^= 1; p.write_bytes(b)
          PYCODE
      - name: Verify and install package or declare miss
        id: consume
        run: python3 scripts/experiments/wasm_package_reuse.py consume --bundle output/package-reuse/incoming
      - name: Normal release build on miss
        if: steps.consume.outputs.reused != 'true'
        run: python3 scripts/measure_render_diff_wasm.py --profile release
      - name: Check intended hit or fallback
        env:
          MODE: ${{ matrix.mode }}
          REUSED: ${{ steps.consume.outputs.reused }}
        run: |
          if [ "$MODE" = hit ]; then
            test "$REUSED" = true
            test ! -d target/pr-review
          else
            test "$REUSED" = false
            test -f target/pr-review/wasm32-unknown-unknown/release/rhwp.wasm
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: rhwp-studio
        run: |
          npm ci
          browser_path=$(npx @puppeteer/browsers install chromium@"${RHWP_CHROMIUM_BUILD_ID}" --path .cache/puppeteer --format '{{path}}' | tail -n 1)
          echo "CHROME_PATH=$(realpath "$browser_path")" >> "$GITHUB_ENV"
      - name: Canvas regression and actual WASM response hash
        working-directory: rhwp-studio
        run: npm run e2e:render-diff:ci
      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            output/render-diff-build/
            output/package-reuse/reuse.json
            rhwp-studio/e2e/screenshots/render-diff/
          retention-days: 3
